name: CI

on:
  pull_request:
  push:
    branches: [main, auto/integration]
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * *'

# Cancel superseded pull-request runs, and only those (HOK-2938).
#
# - pull_request events group by workflow + PR number, so a second push to the
#   same PR cancels the prior in-progress run. Different PRs have different
#   numbers and therefore different groups; they never affect each other.
# - Every other event (push to main/auto/integration, schedule,
#   workflow_dispatch) is keyed by github.run_id, which is unique per run, so
#   those runs never share a group with anything and can never be cancelled or
#   queued behind another run. Grouping pushes by ref instead would let a burst
#   of pushes cancel a *pending* protected-branch run (GitHub allows at most
#   one running + one pending run per group even with cancel-in-progress
#   false), which is exactly the merge lane's behavior pattern.
# - cancel-in-progress is event-conditional as defense in depth: it evaluates
#   true only for pull_request events.
# - Cancellation only affects queued/in_progress runs; a completed run's
#   conclusion is never rewritten. github.event.pull_request.number is stable
#   across reopen/synchronize, so a reopened PR reuses its own group.
#
# Guarded by tools/check-ci-concurrency.ts (runs in test:preflight); behavior
# and the operational validation recipe are documented in
# docs/ci-concurrency.md.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('{0}-pr-{1}', github.workflow, github.event.pull_request.number) || format('{0}-{1}', github.workflow, github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  preflight:
    name: Preflight Checks
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup
        uses: ./.github/actions/setup

      - name: Shell lint and syntax check
        run: npm run lint

      - name: Preflight checks (including test registration enforcement)
        run: npm run test:preflight

  shell:
    name: Shell Tests (shard ${{ matrix.shard }}/3)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup
        uses: ./.github/actions/setup

      - name: Run shell test shard
        run: bash tests/run-shell-suite.sh --shard ${{ matrix.shard }}/3 --timing-out "timing-shell-shard-${{ matrix.shard }}.json"

      - name: Upload timing artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: timing-shell-shard-${{ matrix.shard }}
          path: timing-shell-shard-${{ matrix.shard }}.json
          if-no-files-found: warn
          retention-days: 7

  # Shard-count rule (HOK-2939): the smallest count whose LPT-estimated max
  # shard (per tests/ci-test-weights.json) stays at or below ~240s, leaving
  # headroom against the 5:00 aggregator budget. Update the matrix together
  # with the weights manifest; tools/check-shard-balance.ts (preflight) reads
  # the counts from this file, so matrix and check cannot drift.
  unit:
    name: Unit Tests (shard ${{ matrix.shard }}/7)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7]

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup
        uses: ./.github/actions/setup

      - name: Run unit test shard
        run: bash tests/run-unit-tests.sh --shard ${{ matrix.shard }}/7 --timing-out "timing-unit-shard-${{ matrix.shard }}.json"

      - name: Upload timing artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: timing-unit-shard-${{ matrix.shard }}
          path: timing-unit-shard-${{ matrix.shard }}.json
          if-no-files-found: warn
          retention-days: 7

  custom:
    name: Custom Harness Tests (shard ${{ matrix.shard }}/3)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup
        uses: ./.github/actions/setup

      - name: Run custom harness test shard
        run: bash tests/run-custom-tests.sh --shard ${{ matrix.shard }}/3 --timing-out "timing-custom-shard-${{ matrix.shard }}.json"

      - name: Upload timing artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: timing-custom-shard-${{ matrix.shard }}
          path: timing-custom-shard-${{ matrix.shard }}.json
          if-no-files-found: warn
          retention-days: 7

  smoke:
    name: Smoke and Config Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup
        uses: ./.github/actions/setup

      - name: Run smoke tests
        run: npm run test:smoke

      - name: Run config loading tests
        run: npm run test:config

  certification:
    name: Native Launch Certification
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup
        uses: ./.github/actions/setup

      - name: Certify native fleet
        uses: ./.github/actions/certify-native-fleet

      - name: Run native launch certification
        run: npm run test:native-launch-certification

  harness-retention-shadow:
    name: Harness Retention Shadow
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.event_name == 'push' && github.ref == 'refs/heads/auto/integration' && vars.WAVEMILL_HARNESS_RETENTION_SHADOW == 'true'
    continue-on-error: true

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup
        uses: ./.github/actions/setup

      - name: Run harness retention replay in shadow
        run: |
          npx tsx tools/run-harness-replay.ts \
            --mode shadow \
            --baseline-harness-id "${WAVEMILL_BASELINE_HARNESS_ID:-deployed-unknown}" \
            --candidate-harness-id "${WAVEMILL_CANDIDATE_HARNESS_ID:-${GITHUB_SHA}}"

      - name: Upload harness retention report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: harness-retention-shadow
          path: .wavemill/harness-replay/reports/*.json
          if-no-files-found: warn

  openrouter-alias-audit:
    name: OpenRouter Alias Audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: check-paths
    if: always()
    env:
      RUN_OPENROUTER_ALIAS_AUDIT: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || needs.check-paths.outputs.openrouter_alias_audit == 'true' }}

    steps:
      - name: Fail if change detection did not succeed
        if: (github.event_name == 'pull_request' || github.event_name == 'push') && needs.check-paths.result != 'success'
        run: |
          echo "::error::check-paths did not succeed (${{ needs.check-paths.result }}); cannot determine OpenRouter alias audit relevance."
          exit 1

      - name: Report skip
        if: env.RUN_OPENROUTER_ALIAS_AUDIT != 'true'
        run: echo "No OpenRouter alias audit-relevant changes detected; audit not required for this run."

      - name: Checkout
        if: env.RUN_OPENROUTER_ALIAS_AUDIT == 'true'
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup
        if: env.RUN_OPENROUTER_ALIAS_AUDIT == 'true'
        uses: ./.github/actions/setup

      - name: Audit OpenRouter aliases
        if: env.RUN_OPENROUTER_ALIAS_AUDIT == 'true'
        run: npx tsx tools/audit-openrouter-aliases.ts --json --no-write

  # Aggregates every test job above into one status check.
  #
  # The name is load-bearing: "Shell and Unit Tests" is a required status check
  # on main. Keeping it lets the suite be split into parallel jobs without
  # touching branch protection. Rename only alongside the protection rule.
  shell-and-unit:
    name: Shell and Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: always()
    needs: [preflight, shell, unit, custom, smoke, certification]

    steps:
      - name: Report job results
        run: |
          echo "preflight:     ${{ needs.preflight.result }}"
          echo "shell:         ${{ needs.shell.result }}"
          echo "unit:          ${{ needs.unit.result }}"
          echo "custom:        ${{ needs.custom.result }}"
          echo "smoke:         ${{ needs.smoke.result }}"
          echo "certification: ${{ needs.certification.result }}"

      # Anything other than success fails the check, so a skipped or cancelled
      # job can never be reported green.
      - name: Fail if any test job did not succeed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped')
        run: |
          echo "::error::One or more test jobs did not succeed."
          exit 1

  check-paths:
    name: Check Lifecycle Paths
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      lifecycle: ${{ steps.filter.outputs.lifecycle == 'true' }}
      openrouter_alias_audit: ${{ steps.filter.outputs.openrouter_alias_audit == 'true' }}
      journeys: ${{ steps.filter.outputs.journeys == 'true' }}

    steps:
      - name: Checkout
        if: github.event_name == 'pull_request' || github.event_name == 'push'
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Detect lifecycle-relevant changes
        if: github.event_name == 'pull_request' || github.event_name == 'push'
        id: filter
        uses: dorny/paths-filter@6852f92c20ea7fd3b0c25de3b5112db3a98da050 # v3
        with:
          filters: |
            lifecycle:
              # Core controller loop and phase transitions
              - 'shared/lib/wavemill-mill.sh'
              - 'shared/lib/agent-adapters.sh'
              - 'shared/lib/stage-result.ts'
              - 'shared/lib/wavemill-startup-runner.sh'
              - 'shared/lib/wavemill-status.sh'
              - 'shared/lib/wavemill-common.sh'
              - 'shared/lib/ready-stage.ts'
              # Hook protocol
              - 'shared/hooks/**'
              # Phase/prompt handoff instructions
              - 'tools/prompts/**'
              # Top-level launcher
              - 'wavemill'
              # The lifecycle tests themselves
              - 'tests/run-lifecycle-tests.sh'
              - 'tests/planning-validation.test.sh'
              - 'tests/startup-handoff.test.sh'
              - 'tests/lifecycle-harness.test.sh'
              - 'tests/lifecycle-scenarios.test.sh'
              - 'tests/stage-state.test.sh'
              - 'tests/stage-state.test.ts'
              - 'tests/monitor-ready-transition.test.sh'
              - 'tests/error-recovery.test.sh'
              - 'tests/control-layout.test.sh'
              - 'tests/wavemill-status.test.sh'
              - 'tests/wavemill-dependent-launch.test.sh'
              - 'tests/wavemill-queued-tasks-state.test.sh'
              - 'tests/wavemill-launch-plan-queue-metadata.test.sh'
              - 'tests/terminal-lifecycle-cert-matrix.test.sh'
              - 'tests/terminal-lifecycle-cert-restart.test.sh'
              - 'tests/terminal-lifecycle-cert-budgets.test.sh'
              - 'tests/terminal-lifecycle-flags.test.sh'
              - 'tests/lib/terminal-lifecycle-cert-harness.sh'
              - 'tests/fixtures/lifecycle/parent_pr_triggers_child_launch.sh'
              - 'tests/fixtures/lifecycle/parent_branch_missing_fails_clearly.sh'
              - 'tests/fixtures/lifecycle/**'
              - 'tests/fixtures/terminal-lifecycle/**'
              - 'tests/fixtures/startup/launch-plan-with-queue.json'
              - 'tests/fixtures/startup/launch-plan-no-queue.json'
              # Terminal lifecycle certification report and soak gates
              - 'shared/lib/terminal-lifecycle-cert.ts'
              - 'shared/lib/terminal-lifecycle-cert.test.ts'
              - 'tools/terminal-lifecycle-cert-report.ts'
              - 'tools/terminal-lifecycle-soak.ts'
              - 'docs/terminal-lifecycle-certification.md'
              # Stage result CLI tool
              - 'tools/stage-result-cli.ts'
            # Golden journeys (HOK-3227): paths on the plan -> code -> review ->
            # ready -> tend merge -> reap chain, plus the journeys and fakes.
            journeys:
              - 'shared/lib/wavemill-*.sh'
              - 'shared/lib/agent-adapters.sh'
              - 'shared/lib/condition-reconciler.sh'
              - 'shared/lib/monitor-async-jobs.sh'
              - 'shared/lib/task-progress.*'
              - 'shared/lib/task-identity.*'
              - 'shared/lib/tend-*.ts'
              - 'shared/lib/merge-labels.ts'
              - 'shared/lib/merge-queue.ts'
              - 'shared/lib/pr-state-labels.ts'
              - 'shared/lib/pr-live-state.ts'
              - 'shared/lib/ready-*.ts'
              - 'shared/lib/bounded-retry.*'
              - 'shared/lib/mill-clock.*'
              - 'shared/lib/workflow-state*.ts'
              - 'shared/lib/state-mutex.ts'
              - 'shared/schemas/workflow-task.schema.json'
              - 'shared/lib/stage-result.ts'
              - 'shared/lib/seam-artifacts.ts'
              - 'shared/lib/github.ts'
              - 'shared/lib/linear.ts'
              - 'shared/lib/config.ts'
              - 'shared/hooks/**'
              - 'tools/tend.ts'
              - 'tools/ready.ts'
              - 'tools/stage-result-cli.ts'
              - 'tools/prompts/**'
              - 'tests/journeys/**'
              - 'tests/fakes/**'
              - '.github/workflows/ci.yml'
            openrouter_alias_audit:
              - 'shared/fixtures/model-registry.v1.json'
              - 'shared/lib/disabled-models.ts'
              - 'shared/lib/openrouter-alias-audit.ts'
              - 'shared/lib/openrouter-catalog.ts'
              - 'tools/audit-openrouter-aliases.ts'
              - 'tools/check-openrouter-alias-audit-ci.ts'
              - 'tools/check-openrouter-alias-audit-ci.test.ts'
              - '.github/workflows/ci.yml'

  # Golden journeys (HOK-3227): the real monitor loop + tend driving one task
  # from backlog to merged and reaped against the shared fakes (tests/fakes/).
  # One journey per matrix leg so the suite adds ~0 to CI wall-clock; each
  # journey must finish within JOURNEY_BUDGET_SECONDS (120s, enforced by the
  # harness). Runs on mill-core changes, on promotion (auto/integration ->
  # main), nightly, and on demand; legs always report a conclusion, and the
  # "Golden Journeys" aggregator below is the required check and publishes the
  # merged `timing-journeys` artifact.
  journeys:
    name: Golden Journey (${{ matrix.journey }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: check-paths
    if: always()
    strategy:
      fail-fast: false
      matrix:
        journey: [incident-currentness, challenger-contract-recovery, native-ownership-recovery, agent-killed-mid-stage, picker-pending-touch-set, happy-path, gh-lag-after-push, errored-with-pr, inputs-ready-before-approval, mid-flight-base-conflict, tend-rebase-conflict-single-comment, challenge-pair-eval, ready-fail-remediate, dirty-tree-coding-complete, post-merge-eval-reap, agent-idle-background-job, operator-abort-mid-coding]
    env:
      RUN_JOURNEYS: ${{ needs.check-paths.outputs.journeys == 'true' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'pull_request' && github.head_ref == 'auto/integration' && github.base_ref == 'main') }}

    steps:
      - name: Fail if change detection did not succeed
        if: needs.check-paths.result != 'success'
        run: |
          echo "::error::check-paths did not succeed (${{ needs.check-paths.result }}); cannot determine journey relevance."
          exit 1

      - name: Report skip
        if: env.RUN_JOURNEYS != 'true'
        run: echo "No mill-core changes detected; golden journeys not required for this change."

      - name: Checkout
        if: env.RUN_JOURNEYS == 'true'
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup
        if: env.RUN_JOURNEYS == 'true'
        uses: ./.github/actions/setup
        with:
          packages: jq tmux

      - name: Run journey
        if: env.RUN_JOURNEYS == 'true'
        env:
          JOURNEY_ARTIFACT_DIR: ${{ runner.temp }}/journey-artifacts
          JOURNEY_BUDGET_SECONDS: 120
        run: |
          start=$(date +%s)
          rc=0
          bash tests/journeys/run-journeys.sh "${{ matrix.journey }}" || rc=$?
          # One TimingDoc test entry (tools/ci-test-timings.ts shape).
          jq -n --arg id "${{ matrix.journey }}" --argjson ms "$(( ($(date +%s) - start) * 1000 ))" \
            --arg result "$([[ $rc == 0 ]] && echo pass || echo fail)" \
            '{id: $id, elapsedMs: $ms, budgetMs: (env.JOURNEY_BUDGET_SECONDS | tonumber * 1000), result: $result}' \
            > "timing-journeys-${{ matrix.journey }}.json"
          exit "$rc"

      - name: Upload journey artifacts on failure
        if: env.RUN_JOURNEYS == 'true' && failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: journey-failure-${{ matrix.journey }}
          path: ${{ runner.temp }}/journey-artifacts
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload journey timing
        if: env.RUN_JOURNEYS == 'true' && always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: timing-journeys-${{ matrix.journey }}
          path: timing-journeys-${{ matrix.journey }}.json
          if-no-files-found: ignore
          retention-days: 7

  # Single required status check for the journey matrix. Branch protection
  # requires "Golden Journeys", so adding a journey to the matrix never needs a
  # protection change. Legs that skip (no mill-core changes) report success.
  # The name is load-bearing; rename only alongside the protection rule.
  journeys-required:
    name: Golden Journeys
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: always()
    needs: [journeys]

    steps:
      - name: Report journey results
        run: echo "journeys=${{ needs.journeys.result }}"

      - name: Download per-journey timings
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        continue-on-error: true
        with:
          pattern: timing-journeys-*
          path: journey-timings
          merge-multiple: true

      - name: Check journey timing artifacts
        run: |
          if [ -d journey-timings ] && [ "$(ls -A journey-timings 2>/dev/null)" ]; then
            echo "✓ Found journey timing artifacts"
          else
            echo "ℹ️  No journey timing artifacts found (journeys may have been skipped)"
          fi

      - name: Merge journey timings
        id: timings
        run: |
          shopt -s nullglob
          files=(journey-timings/*.json)
          if (( ${#files[@]} == 0 )); then
            echo "No journey timings (journeys skipped)."
            exit 0
          fi
          jq -s --arg runId "${{ github.run_id }}" --arg sha "${{ github.sha }}" \
            '{suite: "journeys", shard: "all", runId: $runId, sha: $sha, generatedAt: (now | todate), tests: .}' \
            "${files[@]}" > timing-journeys.json
          jq -r '.tests[] | "\(.id): \(.elapsedMs / 1000)s of \(.budgetMs / 1000)s budget (\(.result))"' timing-journeys.json
          echo "present=true" >> "$GITHUB_OUTPUT"

      - name: Upload timing-journeys
        if: steps.timings.outputs.present == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: timing-journeys
          path: timing-journeys.json
          retention-days: 7

      - name: Fail unless every journey succeeded
        if: needs.journeys.result != 'success'
        run: |
          echo "::error::One or more golden journeys did not succeed (${{ needs.journeys.result }})."
          exit 1

  lifecycle-integration:
    name: Lifecycle Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: check-paths
    # This job must ALWAYS run. "Lifecycle Integration Tests" is a required status
    # check on auto/integration, and a skipped job never satisfies a required check
    # ("N of N required status checks are expected"). Gating the job itself on a
    # path filter therefore made every PR touching no lifecycle path permanently
    # unmergeable. The filter now gates the steps instead, so the check always
    # reports a conclusion -- same shape as the "Shell and Unit Tests" aggregator
    # above. Do not rename this job without updating branch protection.
    if: always()
    env:
      RUN_LIFECYCLE: ${{ needs.check-paths.outputs.lifecycle == 'true' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}

    steps:
      # Never report green when change detection itself failed, or this job would
      # mask a broken check-paths and wave every PR through.
      - name: Fail if change detection did not succeed
        if: needs.check-paths.result != 'success'
        run: |
          echo "::error::check-paths did not succeed (${{ needs.check-paths.result }}); cannot determine lifecycle relevance."
          exit 1

      - name: Report skip
        if: env.RUN_LIFECYCLE != 'true'
        run: echo "No lifecycle-relevant changes detected; suite not required for this PR."

      - name: Checkout
        if: env.RUN_LIFECYCLE == 'true'
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup
        if: env.RUN_LIFECYCLE == 'true'
        uses: ./.github/actions/setup
        with:
          packages: jq tmux

      - name: Run lifecycle integration tests
        if: env.RUN_LIFECYCLE == 'true'
        run: bash tests/run-lifecycle-tests.sh
